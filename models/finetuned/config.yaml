# Training configuration.
# Controls dataset paths/labels, model backbone choice, and training hyperparameters.

# ---- Data / labels ----
data_dir: "./data"  # expects subfolders named according to class_map keys
output_dir: "./output"
projection: "VD"    # which radiographic projection to use

class_map:
  ausencia: 0
  ambos: 1
  pleura: 1
  intrapulmonar: 1

# ---- Model ----
model_name: resnet34
pretrained: true

use_torchxrayvision: true
xrv_model_name: "resnet50-res512-all"

use_evax: false
eva_x_size: "small"

grayscale_input: false  # if true, ImageNet pretrained weights cannot be used

# ---- Training ----
batch_size: 16
num_epochs: 15
lr: 1e-5
num_workers: 4

use_augmentation: true
use_dropout: true
dropout_rate: 0.3

val_split: 0.15
test_split: 0.15

seed: 42
